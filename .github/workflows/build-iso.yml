# Builds the Lumen OS 1 ISO on GitHub's servers.
# GitHub: Actions tab > "Build Lumen OS ISO" > Run workflow. Takes ~40-60 minutes.
# Works whether the repo holds the project folder or just lumen-os.zip.
name: Build Lumen OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Unpack the project
        run: |
          if [ -f build.sh ]; then
            echo "Project folder found."
            echo "PROJECT=$PWD" >> "$GITHUB_ENV"
          elif [ -f lumen-os.zip ]; then
            unzip -q lumen-os.zip -d unpacked
            echo "PROJECT=$PWD/unpacked/lumen-os" >> "$GITHUB_ENV"
          else
            echo "Couldn't find build.sh or lumen-os.zip in the repository." >&2
            exit 1
          fi

      - name: Build the ISO (inside Debian 13)
        run: |
          sudo docker run --rm --privileged -v "$PROJECT":/build -w /build debian:trixie bash -c '
            set -e
            sed -i "s/^Components:.*/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
            apt-get update
            apt-get install -y live-build
            bash build.sh
          '

      - name: Show the end of the log if it failed
        if: failure()
        run: tail -n 60 "$PROJECT/build.log" || true

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: lumen-os-1-amd64
          path: |
            ${{ env.PROJECT }}/lumen-os-1-amd64.iso
            ${{ env.PROJECT }}/lumen-os-1-amd64.iso.sha256
          compression-level: 0
          retention-days: 14
